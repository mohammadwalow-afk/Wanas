<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b0b0f">
<title>ونس</title>
<style>
  :root{
    --bg:#0b0b0f; --panel:#15151ce6; --solid:#15151c; --line:#2a2a36;
    --gold:#e8b84a; --gold-dark:#b88a22;
    --text:#ffffff; --muted:#a9a7b0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
  .screen{display:none;flex-direction:column;height:100dvh}
  .screen.active{display:flex}
  .scenery{background-size:cover;background-position:center bottom}

  header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header h1{font-size:24px;color:var(--gold);letter-spacing:.5px}
  .icon-btn{background:none;border:none;color:var(--gold);font-size:24px;padding:4px 8px;cursor:pointer}

  /* مؤشر الاتصال */
  .net{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .bars{display:flex;align-items:flex-end;gap:2px;height:16px}
  .bars i{display:block;width:4px;border-radius:1px;background:#444}
  .bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}
  .bars i:nth-child(3){height:12px}.bars i:nth-child(4){height:16px}
  .bars i.on{background:#3ddc84}
  .net.off .bars i.on{background:#ff5d5d}
  .net.off{color:#ff8a8a}

  /* قائمة المحادثات */
  #chatList{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  .chat-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;cursor:pointer}
  .chat-item:active{border-color:var(--gold-dark)}
  .avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex-shrink:0;text-transform:uppercase}
  .chat-info{flex:1;min-width:0}
  .chat-name{font-weight:700;font-size:17px}
  .chat-last{color:#d0cfd6;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .chat-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .chat-time{color:var(--muted);font-size:12px}
  .badge{background:var(--gold);color:#000;border-radius:12px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 6px}
  .empty{padding:20px;text-align:center;color:#fff;line-height:1.8;background:var(--panel);border-radius:16px}

  /* الرسائل */
  #messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:80%;padding:10px 14px;border-radius:18px;line-height:1.55;font-size:16px;word-wrap:break-word;white-space:pre-wrap;box-shadow:0 2px 6px #0006}
  .msg.mine{align-self:flex-start;background:var(--gold);color:#111;border-bottom-right-radius:4px}
  .msg.theirs{align-self:flex-end;background:#1d1d27;color:#fff;border:1px solid #3a3a48;border-bottom-left-radius:4px}
  .msg .t{display:block;font-size:11px;opacity:.85;margin-top:4px;text-align:left;direction:ltr}
  .tick{margin-left:4px;font-size:12px;letter-spacing:-2px}
  .tick.read{color:#0a5cff;font-weight:700;opacity:1}
  .msg img,.msg video{display:block;max-width:100%;max-height:300px;border-radius:12px;margin-bottom:4px;background:#000;min-height:60px;min-width:120px}
  .day{align-self:center;background:#000a;color:#fff;font-size:12px;padding:4px 14px;border-radius:12px}

  .composer{display:flex;align-items:flex-end;gap:6px;padding:10px;background:var(--panel);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .composer textarea{flex:1;background:#0b0b0f;color:#fff;border:1px solid var(--line);border-radius:22px;padding:11px 16px;font-size:16px;font-family:inherit;resize:none;max-height:120px;outline:none}
  .composer textarea:focus{border-color:var(--gold-dark)}
  .round{width:44px;height:44px;border-radius:50%;border:none;font-size:20px;cursor:pointer;flex-shrink:0;background:#22222d;color:var(--gold)}
  .send{background:var(--gold);color:#000}
  .round:active{transform:scale(.92)}

  /* نوافذ */
  .modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal.show{display:flex}
  .box{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:340px}
  .box h2{color:var(--gold);margin-bottom:14px;font-size:18px}
  .box input{width:100%;background:var(--bg);color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin-bottom:12px;outline:none;font-family:inherit}
  .box input:focus{border-color:var(--gold-dark)}
  .row{display:flex;gap:8px}
  .btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--gold);color:#000}
  .btn.ghost{background:var(--bg);color:#fff;border:1px solid var(--line)}
  .btn.danger{background:#3a1515;color:#ff9a9a;border:1px solid #6a2525}
  .btn:disabled{opacity:.5}
  .msgline{font-size:13px;line-height:1.6;margin-bottom:12px;min-height:0;color:#ff9a9a}
  .msgline.ok{color:#8be0a4}

  /* شاشة الدخول */
  #auth{justify-content:center;align-items:center;padding:20px}
  .tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;padding:10px;border:none;background:none;color:var(--muted);font-size:15px;font-family:inherit;font-weight:600;border-radius:9px}
  .tabs button.active{background:var(--gold);color:#000}

  /* عرض الوسائط بملء الشاشة */
  #viewer{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:20}
  #viewer.show{display:flex}
  #viewer img,#viewer video{max-width:100%;max-height:100%}
  #viewer .x{position:absolute;top:14px;left:14px;background:#000a;color:#fff;border:none;font-size:26px;width:44px;height:44px;border-radius:50%}

  /* شاشة البث */
  #live{background:#000}
  #liveVideo{flex:1;width:100%;object-fit:cover;background:#000;transform:scaleX(-1)}
  .live-bar{position:absolute;bottom:0;left:0;right:0;padding:20px;text-align:center;background:linear-gradient(transparent,#000d)}
  .live-bar p{color:#ddd;font-size:14px;margin-bottom:12px;line-height:1.6}
</style>
</head>
<body>

<!-- تسجيل الدخول -->
<div class="screen scenery" id="auth">
  <div class="box" style="max-width:360px">
    <h1 style="color:var(--gold);text-align:center;font-size:36px;margin-bottom:4px">ونس</h1>
    <p style="color:#bbb;text-align:center;font-size:14px;margin-bottom:16px">دردشة مع أصدقائك</p>
    <div class="tabs"><button id="tabIn" class="active">دخول</button><button id="tabUp">حساب جديد</button></div>
    <input id="authUser" placeholder="اسم المستخدم (إنجليزي)" autocapitalize="none" autocomplete="username" autocorrect="off" spellcheck="false" dir="ltr">
    <input id="authPass" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
    <div class="msgline" id="authMsg"></div>
    <button class="btn primary" id="authGo" style="width:100%">دخول</button>
  </div>
</div>

<!-- الرئيسية -->
<div class="screen scenery" id="home">
  <header>
    <h1>ونس</h1>
    <div class="net" style="flex:1"><div class="bars"><i></i><i></i><i></i><i></i></div><span class="nettext"></span></div>
    <button class="icon-btn" id="wallBtn" title="الإعدادات">⚙️</button>
    <button class="icon-btn" id="addBtn" title="إضافة صديق">＋</button>
  </header>
  <div id="chatList"></div>
</div>

<!-- المحادثة -->
<div class="screen scenery" id="chat">
  <header>
    <button class="icon-btn" id="backBtn">›</button>
    <div class="avatar" id="chatAvatar" style="width:40px;height:40px;font-size:17px"></div>
    <div style="flex:1;min-width:0">
      <div id="chatTitle" style="font-weight:700"></div>
      <div class="net"><div class="bars"><i></i><i></i><i></i><i></i></div><span class="nettext"></span></div>
    </div>
    <button class="icon-btn" id="liveBtn" title="بث مباشر">📹</button>
  </header>
  <div id="messages"></div>
  <div class="composer">
    <button class="round" id="attachBtn" title="صورة أو فيديو">📎</button>
    <button class="round" id="camBtn" title="الكاميرا">📷</button>
    <textarea id="input" rows="1" placeholder="اكتب رسالة..."></textarea>
    <button class="round send" id="sendBtn">➤</button>
  </div>
  <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
  <input type="file" id="camInput" accept="image/*,video/*" capture="environment" hidden>
</div>

<!-- البث المباشر (معاينة الكاميرا حالياً) -->
<div class="screen" id="live" style="position:relative">
  <video id="liveVideo" autoplay playsinline muted></video>
  <div class="live-bar">
    <p>هذه معاينة كاميرتك. البث المباشر مع صديقك في الخطوة القادمة.</p>
    <div class="row">
      <button class="btn ghost" id="flipBtn">🔄 قلب الكاميرا</button>
      <button class="btn primary" id="liveClose">إغلاق</button>
    </div>
  </div>
</div>

<!-- إضافة صديق -->
<div class="modal" id="modal">
  <div class="box">
    <h2>إضافة صديق</h2>
    <input id="friendName" placeholder="اسم المستخدم لصديقك" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false" dir="ltr">
    <div class="msgline" id="friendMsg"></div>
    <div class="row">
      <button class="btn ghost" id="cancelBtn">إلغاء</button>
      <button class="btn primary" id="saveBtn">إضافة</button>
    </div>
  </div>
</div>

<!-- الإعدادات -->
<div class="modal" id="wallModal">
  <div class="box">
    <h2>الإعدادات</h2>
    <p id="meLine" style="color:#ddd;font-size:15px;margin-bottom:14px" dir="auto"></p>
    <p style="color:#bbb;font-size:13px;line-height:1.7;margin-bottom:8px">الخلفية: اختر صورة حقيقية لمنظر طبيعي من هاتفك.</p>
    <button class="btn primary" id="wallPick" style="width:100%;margin-bottom:8px">🖼️ اختيار صورة الخلفية</button>
    <button class="btn ghost" id="wallDefault" style="width:100%;margin-bottom:8px">إرجاع الخلفية الافتراضية</button>
    <button class="btn danger" id="logoutBtn" style="width:100%;margin-bottom:8px">تسجيل الخروج</button>
    <button class="btn ghost" id="wallCancel" style="width:100%">إغلاق</button>
  </div>
</div>
<input type="file" id="wallInput" accept="image/*" hidden>

<div id="viewer"><button class="x" id="viewerClose">✕</button><div id="viewerBody"></div></div>

<script>
/* ============ إعدادات الخادم (Supabase) ============ */
const SB_URL = 'https://cmcrnebofzlbgazreeye.supabase.co';
const SB_KEY = 'sb_publishable_8ifb3pnBCaWOrHNMUV4t2g_7fXrFk1T';
const EMAIL_DOMAIN = '@wanas-chat.app';   // البريد الوهمي المبني على اسم المستخدم

const $ = id => document.getElementById(id);

/* ============ خلفية المنظر الطبيعي الافتراضية ============ */
const SCENE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">
<defs>
<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1530"/><stop offset=".45" stop-color="#2b3a6b"/><stop offset=".7" stop-color="#d98a52"/><stop offset="1" stop-color="#f2c27a"/></linearGradient>
<linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0a266"/><stop offset="1" stop-color="#1c2a45"/></linearGradient>
<radialGradient id="g"><stop offset="0" stop-color="#fff2c9"/><stop offset="1" stop-color="#fff2c900"/></radialGradient>
</defs>
<rect width="400" height="800" fill="url(#s)"/>
<g fill="#fff" opacity=".8"><circle cx="40" cy="60" r="1.2"/><circle cx="120" cy="30" r="1"/><circle cx="210" cy="80" r="1.3"/><circle cx="300" cy="40" r="1"/><circle cx="360" cy="110" r="1.2"/><circle cx="80" cy="140" r="1"/><circle cx="260" cy="150" r="1"/></g>
<circle cx="290" cy="470" r="90" fill="url(#g)"/><circle cx="290" cy="470" r="26" fill="#fff0c4"/>
<polygon points="0,520 70,430 130,500 200,400 280,510 340,450 400,520 400,800 0,800" fill="#3b4a78"/>
<polygon points="0,570 90,480 170,560 250,470 330,555 400,500 400,800 0,800" fill="#26345a"/>
<rect y="590" width="400" height="210" fill="url(#l)"/>
<g fill="#fff" opacity=".18"><rect x="250" y="600" width="80" height="3"/><rect x="265" y="615" width="50" height="3"/><rect x="100" y="640" width="120" height="3"/></g>
<polygon points="0,640 60,560 120,650 180,580 250,660 330,590 400,650 400,800 0,800" fill="#0f1a2c"/>
<g fill="#08101c"><polygon points="20,800 45,690 70,800"/><polygon points="55,800 85,660 115,800"/><polygon points="320,800 350,670 380,800"/><polygon points="355,800 380,700 405,800"/><polygon points="150,800 170,730 190,800"/></g>
</svg>`;
const SCENE_URL = `linear-gradient(#0008,#0004), url("data:image/svg+xml,${encodeURIComponent(SCENE)}")`;
function setBg(css){ document.querySelectorAll('.scenery').forEach(el=> el.style.backgroundImage = css); }
setBg(SCENE_URL);

/* ============ مؤشر الاتصال ============ */
function updateNet(){
  const on = navigator.onLine;
  let bars = 0;
  if(on){
    const c = navigator.connection;
    const map = {'slow-2g':1,'2g':1,'3g':2,'4g':4};
    bars = (c && c.effectiveType && map[c.effectiveType]) || 4;
  }
  document.querySelectorAll('.net').forEach(n=>{
    n.classList.toggle('off', !on);
    n.querySelectorAll('.bars i').forEach((b,i)=> b.classList.toggle('on', on ? i < bars : i === 0));
    n.querySelector('.nettext').textContent = on ? 'متصل' : 'لا يوجد اتصال';
  });
}
if(navigator.connection) navigator.connection.addEventListener('change', updateNet);

/* ============ التخزين على الهاتف ============ */
const KEY = 'wanas_data_v2';
let data = loadData();
function loadData(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.chats) return d; }catch(e){}
  return { me:null, chats:[], lastSync:null };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

/* الصور والفيديو تُحفظ في IndexedDB */
const dbp = new Promise((res,rej)=>{
  const r = indexedDB.open('wanas_media',1);
  r.onupgradeneeded = ()=> r.result.createObjectStore('m');
  r.onsuccess = ()=> res(r.result);
  r.onerror = ()=> rej(r.error);
});
async function putBlob(id, blob){
  const db = await dbp;
  return new Promise((res,rej)=>{
    const tx = db.transaction('m','readwrite');
    tx.objectStore('m').put(blob,id);
    tx.oncomplete = res; tx.onerror = ()=> rej(tx.error);
  });
}
async function getBlob(id){
  const db = await dbp;
  return new Promise((res,rej)=>{
    const rq = db.transaction('m').objectStore('m').get(id);
    rq.onsuccess = ()=> res(rq.result); rq.onerror = ()=> rej(rq.error);
  });
}
async function deleteBlob(id){
  const db = await dbp;
  return new Promise(res=>{
    const tx = db.transaction('m','readwrite');
    tx.objectStore('m').delete(id);
    tx.oncomplete = res; tx.onerror = res;
  });
}

/* ============ أدوات ============ */
let currentId = null;
const fmtTime = ts => new Date(ts).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
const fmtDay  = ts => new Date(ts).toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r = Math.random()*16|0; return (c==='x'? r : (r&0x3|0x8)).toString(16);
  });
}
function show(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(screen).classList.add('active');
}
const onChatScreen = ()=> $('chat').classList.contains('active');
const onHomeScreen = ()=> $('home').classList.contains('active');
function preview(m){
  if(m.media) return m.media.type==='video' ? '🎥 فيديو' : '📷 صورة';
  return m.text;
}
function findChat(id){ return data.chats.find(c=>c.id===id); }

/* ============ مكتبة Supabase (تُحمَّل عند الحاجة، وتعاد المحاولة عند عودة النت) ============ */
let sb = null, libPromise = null;
function loadLib(){
  if(window.supabase) return Promise.resolve(true);
  if(libPromise) return libPromise;
  libPromise = new Promise(res=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload = ()=> res(true);
    s.onerror = ()=>{ libPromise = null; res(false); };
    document.head.appendChild(s);
  });
  return libPromise;
}
async function getClient(){
  if(sb) return sb;
  if(!(await loadLib())) return null;
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
  return sb;
}

/* ============ الدخول وإنشاء الحساب ============ */
let authMode = 'in';
function setAuthMode(m){
  authMode = m;
  $('tabIn').classList.toggle('active', m==='in');
  $('tabUp').classList.toggle('active', m==='up');
  $('authGo').textContent = m==='in' ? 'دخول' : 'إنشاء الحساب';
  $('authPass').autocomplete = m==='in' ? 'current-password' : 'new-password';
  authMsg('');
}
function authMsg(t, ok){
  const el = $('authMsg'); el.textContent = t; el.classList.toggle('ok', !!ok);
}
$('tabIn').onclick = ()=> setAuthMode('in');
$('tabUp').onclick = ()=> setAuthMode('up');

$('authGo').onclick = async ()=>{
  const u = $('authUser').value.trim().toLowerCase();
  const p = $('authPass').value;
  if(!/^[a-z0-9_]{3,20}$/.test(u)) return authMsg('اسم المستخدم: حروف إنجليزية صغيرة وأرقام و _ فقط، من 3 إلى 20 حرفاً.');
  if(p.length < 6) return authMsg('كلمة المرور 6 أحرف على الأقل.');
  if(!navigator.onLine) return authMsg('لا يوجد اتصال بالإنترنت.');
  $('authGo').disabled = true; authMsg('');
  try{
    const c = await getClient();
    if(!c) throw new Error('تعذر الاتصال بالخادم، حاول بعد قليل.');
    const email = u + EMAIL_DOMAIN;
    let res;
    if(authMode==='up'){
      const { data:ex } = await c.from('profiles').select('id').eq('username',u).maybeSingle();
      if(ex) throw new Error('هذا الاسم مستخدم، اختر اسماً آخر.');
      res = await c.auth.signUp({ email, password:p, options:{ data:{ username:u } } });
      if(!res.error && !res.data.session) throw new Error('الحساب أُنشئ لكن الخادم يطلب تأكيد البريد. أوقف خيار Confirm email في إعدادات Supabase ثم سجّل الدخول.');
    }else{
      res = await c.auth.signInWithPassword({ email, password:p });
    }
    if(res.error){
      const m = res.error.message || '';
      if(/Invalid login/i.test(m)) throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة.');
      throw new Error(m);
    }
    const user = res.data.user;
    if(data.me && data.me.id !== user.id){ data = { me:null, chats:[], lastSync:null }; }
    data.me = { id:user.id, username:u };
    save();
    $('authPass').value = '';
    enterApp();
    startSync();
  }catch(e){
    authMsg(e.message || 'حدث خطأ، حاول مرة أخرى.');
  }
  $('authGo').disabled = false;
};

function enterApp(){
  $('meLine').textContent = '👤 ' + data.me.username;
  renderList();
  show('home');
  updateNet();
}

$('logoutBtn').onclick = async ()=>{
  $('wallModal').classList.remove('show');
  try{ if(channel && sb) await sb.removeChannel(channel); }catch(e){}
  channel = null; syncing = false;
  try{ if(sb) await sb.auth.signOut(); }catch(e){}
  data = { me:null, chats:[], lastSync:null };
  save();
  $('authUser').value = ''; $('authPass').value = '';
  setAuthMode('in');
  show('auth');
};

/* ============ قائمة المحادثات ============ */
function renderList(){
  const list = $('chatList');
  list.innerHTML = '';
  const chats = [...data.chats].sort((a,b)=>{
    const ta = a.messages.length ? a.messages[a.messages.length-1].ts : 0;
    const tb = b.messages.length ? b.messages[b.messages.length-1].ts : 0;
    return tb - ta;
  });
  chats.forEach(c=>{
    const last = c.messages[c.messages.length-1];
    const el = document.createElement('div');
    el.className = 'chat-item';
    el.innerHTML = `<div class="avatar"></div>
      <div class="chat-info"><div class="chat-name"></div><div class="chat-last"></div></div>
      <div class="chat-side"><div class="chat-time"></div></div>`;
    el.querySelector('.avatar').textContent = (c.name||'?').trim()[0] || '?';
    el.querySelector('.chat-name').textContent = c.name || '...';
    el.querySelector('.chat-last').textContent = last ? preview(last) : 'ابدأ المحادثة';
    el.querySelector('.chat-time').textContent = last ? fmtTime(last.ts) : '';
    if(c.unread > 0){
      const b = document.createElement('span');
      b.className = 'badge'; b.textContent = c.unread;
      el.querySelector('.chat-side').appendChild(b);
    }
    el.onclick = ()=> openChat(c.id);
    list.appendChild(el);
  });
  if(!chats.length){
    const hint = document.createElement('div');
    hint.className = 'empty';
    hint.textContent = 'لا توجد محادثات بعد. اضغط ＋ وأضف صديقك باسم المستخدم.';
    list.appendChild(hint);
  }
}
function refreshUI(){
  if(onHomeScreen()) renderList();
  if(onChatScreen()) renderMessages();
}

/* ============ المحادثة ============ */
function openChat(id){
  currentId = id;
  const c = findChat(id);
  c.unread = 0;
  $('chatTitle').textContent = c.name || '...';
  $('chatAvatar').textContent = (c.name||'?').trim()[0] || '?';
  save();
  renderMessages(true);
  show('chat');
  markRead(id);
}

const urlCache = {};
async function mediaSrc(m){
  const id = m.media.id;
  if(urlCache[id]) return urlCache[id];
  let blob = null;
  try{ blob = await getBlob(id); }catch(e){}
  if(blob) return urlCache[id] = URL.createObjectURL(blob);
  if(!navigator.onLine) return null;
  const c = await getClient();
  if(!c || !m.media.path) return null;
  const { data:d, error } = await c.storage.from('media').createSignedUrl(m.media.path, 3600);
  if(error || !d) return null;
  if(m.media.type==='video') return d.signedUrl;       // الفيديو يُشغَّل مباشرة
  try{                                                   // الصور تُحفظ للعرض بدون نت
    const r = await fetch(d.signedUrl);
    const b = await r.blob();
    await putBlob(id, b);
    return urlCache[id] = URL.createObjectURL(b);
  }catch(e){ return d.signedUrl; }
}

const TICKS = { pending:'🕐', sent:'✓', delivered:'✓✓', read:'✓✓', failed:'⚠' };

function renderMessages(force){
  const c = findChat(currentId);
  if(!c) return;
  const box = $('messages');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  box.innerHTML = '';
  let lastDay = '';
  c.messages.forEach(m=>{
    const day = fmtDay(m.ts);
    if(day !== lastDay){
      const d = document.createElement('div');
      d.className = 'day'; d.textContent = day;
      box.appendChild(d); lastDay = day;
    }
    const el = document.createElement('div');
    el.className = 'msg ' + (m.from==='me' ? 'mine' : 'theirs');
    if(m.media){
      const holder = document.createElement(m.media.type==='video' ? 'video' : 'img');
      if(m.media.type==='video'){ holder.controls = true; holder.preload = 'metadata'; holder.playsInline = true; }
      mediaSrc(m).then(u=>{
        if(!u) return;
        holder.src = u;
        if(m.media.type==='image') holder.onclick = ()=> openViewer(u);
      });
      el.appendChild(holder);
    }
    if(m.text) el.appendChild(document.createTextNode(m.text));
    const t = document.createElement('span');
    t.className = 't';
    t.appendChild(document.createTextNode(fmtTime(m.ts)));
    if(m.from==='me'){
      const k = document.createElement('span');
      k.className = 'tick' + (m.status==='read' ? ' read' : '');
      k.textContent = TICKS[m.status || 'sent'];
      t.appendChild(k);
    }
    el.appendChild(t);
    box.appendChild(el);
  });
  if(force || nearBottom) box.scrollTop = box.scrollHeight;
}

function addMyMessage(msg){
  const c = findChat(currentId);
  c.messages.push(msg);
  save();
  renderMessages(true);
  flushQueue();
}

function sendMessage(){
  const text = $('input').value.trim();
  if(!text) return;
  addMyMessage({ id:uuid(), from:'me', text, ts:Date.now(), status:'pending' });
  $('input').value = '';
  $('input').style.height = 'auto';
}
$('sendBtn').onclick = sendMessage;
$('input').addEventListener('input', e=>{
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight,120)+'px';
});
$('backBtn').onclick = ()=>{ currentId = null; renderList(); show('home'); };

/* ============ إرسال الصور والفيديو ============ */
async function shrinkImage(file){
  try{
    const bmp = await createImageBitmap(file);
    const max = 1280, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=> cv.toBlob(b=> r(b||file), 'image/jpeg', .85));
  }catch(e){ return file; }
}
function extFor(blob, isVideo){
  const t = (blob.type||'').toLowerCase();
  if(t.includes('quicktime')) return 'mov';
  if(t.includes('webm')) return 'webm';
  if(t.includes('mp4')) return 'mp4';
  if(t.includes('png')) return 'png';
  if(t.includes('jpeg') || t.includes('jpg')) return 'jpg';
  return isVideo ? 'mp4' : 'jpg';
}

async function handleFiles(files){
  for(const f of files){
    const isVideo = f.type.startsWith('video/');
    const isImage = f.type.startsWith('image/');
    if(!isVideo && !isImage) continue;
    if(isVideo && f.size > 50*1024*1024){ alert('حجم الفيديو أكبر من 50 ميغابايت، اختر فيديو أقصر.'); continue; }
    const blob = isImage ? await shrinkImage(f) : f;
    const id = uuid();
    try{ await putBlob(id, blob); }
    catch(e){ alert('تعذر حفظ الملف، قد تكون مساحة الهاتف ممتلئة.'); continue; }
    const path = data.me.id + '/' + id + '.' + extFor(blob, isVideo);
    addMyMessage({ id, from:'me', text:'', ts:Date.now(), status:'pending',
      media:{ id, type: isVideo ? 'video' : 'image', path } });
  }
}
$('attachBtn').onclick = ()=> $('fileInput').click();
$('camBtn').onclick = ()=> $('camInput').click();
$('fileInput').onchange = async e=>{ await handleFiles([...e.target.files]); e.target.value=''; };
$('camInput').onchange  = async e=>{ await handleFiles([...e.target.files]); e.target.value=''; };

function openViewer(url){
  $('viewerBody').innerHTML = '';
  const img = document.createElement('img'); img.src = url;
  $('viewerBody').appendChild(img);
  $('viewer').classList.add('show');
}
$('viewerClose').onclick = ()=> $('viewer').classList.remove('show');

/* ============ المزامنة مع الخادم ============ */
let syncing = false, channel = null, flushing = false;

async function startSync(){
  if(syncing || !data.me) return;
  const c = await getClient();
  if(!c) return;
  syncing = true;
  await syncNow();
  subscribeRealtime();
  flushQueue();
}

async function resolveName(chat){
  const c = await getClient(); if(!c) return;
  const { data:p } = await c.from('profiles').select('username').eq('id', chat.id).maybeSingle();
  if(p){ chat.name = p.username; save(); refreshUI(); if(currentId===chat.id) $('chatTitle').textContent = p.username; }
}

function ingest(r, bulk){
  const me = data.me.id;
  const mine = r.sender === me;
  const fid = mine ? r.receiver : r.sender;
  let chat = findChat(fid);
  if(!chat){
    chat = { id:fid, name:'', messages:[], unread:0 };
    data.chats.push(chat);
    resolveName(chat);
  }
  if(!data.lastSync || r.created_at > data.lastSync) data.lastSync = r.created_at;
  let m = chat.messages.find(x=>x.id===r.id);
  if(!m){
    m = { id:r.id, from: mine ? 'me' : 'them', text:r.body || '', ts:new Date(r.created_at).getTime() };
    if(r.media_path) m.media = { id:r.id, type:r.media_type || 'image', path:r.media_path };
    chat.messages.push(m);
    chat.messages.sort((a,b)=>a.ts-b.ts);
    if(!mine){
      chat.needsRead = true;
      if(!(currentId===fid && onChatScreen() && document.visibilityState==='visible')) chat.unread = (chat.unread||0) + 1;
    }
  }
  if(mine) m.status = r.read_at ? 'read' : (r.delivered_at ? 'delivered' : 'sent');
  if(!bulk){
    save(); refreshUI();
    if(!mine){
      if(sb) sb.rpc('mark_delivered');
      if(currentId===fid && onChatScreen()) markRead(fid);
    }
  }
}

function applyStatus(r){
  for(const chat of data.chats){
    const m = chat.messages.find(x=>x.id===r.id);
    if(m && m.from==='me'){
      m.status = r.read_at ? 'read' : (r.delivered_at ? 'delivered' : 'sent');
      return;
    }
  }
}

async function syncNow(){
  const c = sb; if(!c || !data.me) return;
  const me = data.me.id;
  try{
    let q = c.from('messages').select('*').or(`sender.eq.${me},receiver.eq.${me}`).order('created_at').limit(1000);
    if(data.lastSync) q = q.gt('created_at', data.lastSync);
    const { data:rows, error } = await q;
    if(!error && rows) rows.forEach(r=> ingest(r, true));
    const { data:mine } = await c.from('messages').select('id,delivered_at,read_at')
      .eq('sender', me).is('read_at', null).limit(300);
    if(mine) mine.forEach(applyStatus);
    save(); refreshUI();
    c.rpc('mark_delivered');
    if(currentId && onChatScreen()) markRead(currentId);
  }catch(e){}
}

function subscribeRealtime(){
  if(!sb || channel || !data.me) return;
  const me = data.me.id;
  channel = sb.channel('wanas-' + me)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:'receiver=eq.'+me }, p=> ingest(p.new))
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'messages', filter:'sender=eq.'+me }, p=>{
      applyStatus(p.new); save(); refreshUI();
    })
    .subscribe();
}

async function markRead(fid){
  const chat = findChat(fid);
  if(!chat || !chat.needsRead || !sb || !navigator.onLine) return;
  try{
    const { error } = await sb.rpc('mark_read', { friend: fid });
    if(!error){ chat.needsRead = false; save(); }
  }catch(e){}
}

/* إرسال الرسائل المعلّقة (تعمل تلقائياً عند عودة الإنترنت) */
async function flushQueue(){
  if(flushing || !data.me || !navigator.onLine) return;
  const c = await getClient(); if(!c) return;
  flushing = true;
  try{
    for(const chat of data.chats){
      for(const m of chat.messages){
        if(m.from!=='me' || m.status!=='pending') continue;
        if(m.media){
          const blob = await getBlob(m.media.id);
          if(!blob){ m.status = 'failed'; continue; }
          const { error:ue } = await c.storage.from('media').upload(m.media.path, blob, { contentType: blob.type || undefined, upsert:false });
          if(ue && !/exist|duplicate/i.test(ue.message||'')) throw ue;
        }
        const { error } = await c.from('messages').insert({
          id:m.id, sender:data.me.id, receiver:chat.id, body:m.text || '',
          media_path: m.media ? m.media.path : null, media_type: m.media ? m.media.type : null
        });
        if(error && error.code !== '23505') throw error;
        m.status = 'sent';
        save(); refreshUI();
      }
    }
  }catch(e){}
  flushing = false;
}
setInterval(flushQueue, 15000);

addEventListener('online', ()=>{
  updateNet();
  if(data.me){ startSync().then(()=>{ syncNow(); flushQueue(); }); }
});
addEventListener('offline', updateNet);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && currentId && onChatScreen()){
    const c = findChat(currentId); if(c){ c.unread = 0; save(); }
    markRead(currentId);
  }
});

/* ============ معاينة الكاميرا (تمهيد للبث المباشر) ============ */
let stream = null, facing = 'user';
async function startCam(){
  stopCam();
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: facing }, audio:false });
    $('liveVideo').srcObject = stream;
    $('liveVideo').style.transform = facing==='user' ? 'scaleX(-1)' : 'none';
  }catch(e){
    alert('لم يتم السماح باستخدام الكاميرا. فعّل إذن الكاميرا من إعدادات المتصفح.');
    closeLive();
  }
}
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } }
function closeLive(){ stopCam(); show('chat'); }
$('liveBtn').onclick = ()=>{ show('live'); startCam(); };
$('liveClose').onclick = closeLive;
$('flipBtn').onclick = ()=>{ facing = facing==='user' ? 'environment' : 'user'; startCam(); };

/* ============ إضافة صديق ============ */
function friendMsg(t, ok){ const el = $('friendMsg'); el.textContent = t; el.classList.toggle('ok', !!ok); }
$('addBtn').onclick = ()=>{ $('friendName').value=''; friendMsg(''); $('modal').classList.add('show'); $('friendName').focus(); };
$('cancelBtn').onclick = ()=> $('modal').classList.remove('show');
$('saveBtn').onclick = async ()=>{
  const u = $('friendName').value.trim().toLowerCase().replace(/^@/,'');
  if(!u) return;
  if(u === data.me.username) return friendMsg('هذا اسمك أنت 🙂');
  if(!navigator.onLine) return friendMsg('تحتاج إنترنت للبحث عن صديقك.');
  $('saveBtn').disabled = true; friendMsg('جارٍ البحث...', true);
  try{
    const c = await getClient();
    if(!c) throw new Error('تعذر الاتصال بالخادم.');
    const { data:p, error } = await c.from('profiles').select('id,username').eq('username', u).maybeSingle();
    if(error) throw error;
    if(!p) throw new Error('لا يوجد مستخدم بهذا الاسم.');
    let chat = findChat(p.id);
    if(!chat){ chat = { id:p.id, name:p.username, messages:[], unread:0 }; data.chats.push(chat); save(); }
    $('modal').classList.remove('show');
    renderList();
    openChat(p.id);
  }catch(e){
    friendMsg(e.message || 'حدث خطأ.');
  }
  $('saveBtn').disabled = false;
};

/* ============ الإعدادات وخلفية من صورتك ============ */
let wallURL = null;
async function loadWallpaper(){
  try{
    const blob = await getBlob('wallpaper');
    if(!blob) return;
    if(wallURL) URL.revokeObjectURL(wallURL);
    wallURL = URL.createObjectURL(blob);
    setBg(`linear-gradient(#000a,#0006), url("${wallURL}")`);
  }catch(e){}
}
$('wallBtn').onclick = ()=> $('wallModal').classList.add('show');
$('wallCancel').onclick = ()=> $('wallModal').classList.remove('show');
$('wallPick').onclick = ()=> $('wallInput').click();
$('wallInput').onchange = async e=>{
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  try{
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const blob = await new Promise(r=> cv.toBlob(r,'image/jpeg',.88));
    await putBlob('wallpaper', blob);
    await loadWallpaper();
    $('wallModal').classList.remove('show');
  }catch(err){
    alert('تعذر استخدام هذه الصورة، جرّب صورة أخرى.');
  }
};
$('wallDefault').onclick = async ()=>{
  await deleteBlob('wallpaper');
  setBg(SCENE_URL);
  $('wallModal').classList.remove('show');
};

/* ============ التشغيل ============ */
async function boot(){
  updateNet();
  loadWallpaper();
  if(data.me){ enterApp(); } else { setAuthMode('in'); show('auth'); }
  const c = await getClient();
  if(!c) return;
  if(!data.me) return;
  let session = null;
  try{ const r = await c.auth.getSession(); session = r.data && r.data.session; }catch(e){}
  if(session && session.user.id === data.me.id){
    startSync();
  }else if(navigator.onLine){
    setAuthMode('in');
    $('authUser').value = data.me.username;
    authMsg('انتهت الجلسة، سجّل الدخول من جديد.');
    show('auth');
  }
}
boot();
