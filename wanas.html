<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cats AI - كاتس</title>
    <!-- ربط الأيقونات للمكالمات -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --whatsapp-green: #008069;
            --whatsapp-dark: #005c4b;
            --text-dark: #111b21;
            --user-bubble: rgba(217, 253, 211, 0.95);
            --ai-bubble: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* خلفية منظر طبيعي خلاب بجودة عالية ومريحة للعين */
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* شريط العنوان العلوي */
        .header {
            background-color: var(--whatsapp-dark);
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background-color: #eceff1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .user-details h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .user-details .status {
            font-size: 0.8rem;
            color: #86ffb4;
        }

        .call-actions {
            display: flex;
            gap: 20px;
            font-size: 1.3rem;
        }

        .call-actions i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .call-actions i:hover {
            color: #86ffb4;
        }

        /* منطقة المحادثة الفائقة الوضوح */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: rgba(0, 0, 0, 0.2); /* طبقة تعتيم خفيفة لإبراز الخطوط */
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.5;
            color: var(--text-dark);
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .message.user {
            background-color: var(--user-bubble);
            align-self: flex-start;
            border-top-right-radius: 0;
        }

        .message.ai {
            background-color: var(--ai-bubble);
            align-self: flex-end;
            border-top-left-radius: 0;
        }

        /* شريط الإدخال السفلي */
        .input-area {
            background-color: rgba(240, 242, 245, 0.95);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
        }

        .send-btn {
            background-color: var(--whatsapp-green);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        /* واجهة شاشة المكالمات المنبثقة */
        .call-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111b21;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 20px;
            z-index: 100;
            display: none;
        }

        .call-avatar {
            width: 120px;
            height: 120px;
            background-color: #233138;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        .call-status {
            color: #86ffb4;
            animation: pulse 1.5s infinite;
        }

        .video-container {
            width: 80%;
            max-width: 400px;
            height: 250px;
            background: #000;
            border-radius: 15px;
            display: none;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .call-buttons {
            display: flex;
            gap: 30px;
        }

        .btn-call {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .btn-call.hangup { background-color: #ea0038; }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar">🐾</div>
            <div class="user-details">
                <h1>Cats AI</h1>
                <div class="status">متصل الآن</div>
            </div>
        </div>
        <div class="call-actions">
            <i class="fas fa-video" onclick="startCall('video')"></i>
            <i class="fas fa-phone" onclick="startCall('voice')"></i>
        </div>
    </div>

    <div class="chat-container" id="chat-box">
        <div class="message ai">
            أهلاً بك يا معلمي محمد في تطبيقك المستقل الجديد **Cats AI**! 🌄<br><br>
            هذه المنصة مخصصة لك ولأصدقائك بوضوح فائق ومميزات مكالمات كاملة.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <!-- شاشة المكالمات -->
    <div class="call-overlay" id="callWindow">
        <div style="text-align: center;">
            <div class="call-avatar">🐾</div>
            <h2>Cats AI Connection</h2>
            <div class="call-status" id="callTypeStatus">جاري الاتصال...</div>
        </div>
        <div class="video-container" id="videoContainer">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="call-buttons">
            <button class="btn-call hangup" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const chatBox = document.getElementById('chat-box');
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerHTML = messageText;
            chatBox.appendChild(userDiv);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai';
                aiDiv.innerHTML = "رسالة ذكية مستلمة في تطبيق Cats الجديد! سنربط الـ API الخاص بـ Gemini في الخطوة القادمة للرد الفعلي الحقيقي.";
                chatBox.appendChild(aiDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        let localStream = null;
        async function startCall(type) {
            document.getElementById('callWindow').style.display = 'flex';
            const status = document.getElementById('callTypeStatus');
            const videoBox = document.getElementById('videoContainer');

            if (type === 'video') {
                status.textContent = "جاري تشغيل مكالمة الفيديو البصرية...";
                videoBox.style.display = 'block';
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('localVideo').srcObject = localStream;
                } catch (err) {
                    status.textContent = "تم بدء المكالمة (بدون كاميرا - يرجى إعطاء الإذن)";
                }
            } else {
                status.textContent = "جاري الاتصال الصوتي المشفر...";
                videoBox.style.display = 'none';
            }
        }

        function endCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('callWindow').style.display = 'none';
        }
